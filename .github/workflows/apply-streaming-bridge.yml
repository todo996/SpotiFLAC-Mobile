name: Apply Streaming Bridge Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_backend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/streaming-web-vietnamese

      - name: Verify reserved host stream dispatch exists
        run: |
          grep -q 'invokeReservedHostAction(extensionID, actionName)' extension_manager.go

      - name: Test Go backend
        run: go test ./...

      - name: Vet Go backend
        run: go vet ./...
