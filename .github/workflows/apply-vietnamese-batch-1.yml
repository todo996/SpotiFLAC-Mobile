            'extensionPostProcessing': 'Hậu xử lý',
          }

          unknown = sorted(set(translations) - set(base))
          if unknown:
              raise SystemExit(f'Unknown translation keys: {unknown}')

          placeholder = re.compile(r'\{([A-Za-z_][A-Za-z0-9_]*)')
          for key, value in translations.items():
              expected = set(placeholder.findall(str(base[key])))
              actual = set(placeholder.findall(value))
              if expected != actual:
                  raise SystemExit(f'Placeholder mismatch for {key}: {expected} != {actual}')

          vi.update(translations)
          path.write_text(json.dumps(vi, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Applied {len(translations)} Vietnamese translations')
          PY

      - name: Validate JSON
        run: python3 -m json.tool lib/l10n/arb/app_vi.arb >/dev/null

      - name: Commit Vietnamese batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/arb/app_vi.arb
          git diff --cached --quiet && exit 0
          git commit -m "feat(l10n): expand natural Vietnamese coverage"
          git push origin HEAD:feature/streaming-web-vietnamese
