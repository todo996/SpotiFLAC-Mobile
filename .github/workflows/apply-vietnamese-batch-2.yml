name: Apply Vietnamese Batch 2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - ".github/workflows/apply-vietnamese-batch-2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/streaming-web-vietnamese

      - name: Merge natural Vietnamese translations
