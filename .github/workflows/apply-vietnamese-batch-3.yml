            'cueSplitTrackCount': '{count} bài hát',
            'cueSplitConfirmTitle': 'Xác nhận tách album CUE',
          }

          unknown = sorted(set(translations) - set(base))
          if unknown:
              raise SystemExit(f'Unknown translation keys: {unknown}')

          for key, value in translations.items():
              metadata = base.get('@' + key, {})
              expected = set((metadata.get('placeholders') or {}).keys()) if isinstance(metadata, dict) else set()
              missing = [name for name in expected if ('{' + name + '}') not in value and ('{' + name + ',') not in value]
              if missing:
                  raise SystemExit(f'Missing placeholder(s) for {key}: {missing}')

          vi.update(translations)
          path.write_text(json.dumps(vi, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Applied {len(translations)} Vietnamese translations')
          PY

      - name: Validate JSON
        run: python3 -m json.tool lib/l10n/arb/app_vi.arb >/dev/null

      - name: Commit Vietnamese batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/arb/app_vi.arb
          git diff --cached --quiet && exit 0
          git commit -m "feat(l10n): translate library cache and metadata UI"
          git push origin HEAD:feature/streaming-web-vietnamese
