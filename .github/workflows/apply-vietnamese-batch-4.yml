name: Apply Vietnamese Batch 4

on:
  workflow_dispatch:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - ".github/workflows/apply-vietnamese-batch-4.yml"

permissions:
  contents: write

