name: Feature Branch CI

on:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - 'go_backend/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - '.github/workflows/feature-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go format, vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum
      - name: Check new streaming files formatting
        run: test -z "$(gofmt -l extension_stream.go extension_stream_test.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
