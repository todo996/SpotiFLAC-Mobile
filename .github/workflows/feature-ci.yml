name: Feature Branch CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go streaming validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_backend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/streaming-web-vietnamese

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Check streaming file formatting
        run: test -z "$(gofmt -l extension_stream.go extension_stream_test.go extension_host_action.go extension_host_action_test.go)"

      - name: Test Go backend
        run: go test ./...

      - name: Vet Go backend
        run: go vet ./...
