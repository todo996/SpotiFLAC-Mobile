name: Fix Vietnamese Batch Validator

on:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - ".github/workflows/fix-vietnamese-batch-validator.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/streaming-web-vietnamese

      - name: Replace faulty placeholder validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-vietnamese-batch-2.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index("          placeholder = re.compile")
          end_marker = "                  raise SystemExit(f'Placeholder mismatch for {key}: {expected} != {actual}')\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = (
              "          for key, value in translations.items():\n"
              "              metadata = base.get('@' + key, {})\n"
              "              expected = set((metadata.get('placeholders') or {}).keys()) if isinstance(metadata, dict) else set()\n"
              "              missing = [name for name in expected if ('{' + name + '}') not in value and ('{' + name + ',') not in value]\n"
              "              if missing:\n"
              "                  raise SystemExit(f'Missing placeholder(s) for {key}: {missing}')\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit validator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-vietnamese-batch-2.yml
          git commit -m "fix(l10n): validate declared ARB placeholders"
          git push origin HEAD:feature/streaming-web-vietnamese
