name: One-shot Mobile Engine Integration

on:
  push:
    branches:
      - ci/integrate-mobile-engine-20260910-1

permissions:
  contents: write

jobs:
  integrate:
    name: Patch, verify, and commit mobile streaming engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ci-src

      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/streaming-web-vietnamese
          fetch-depth: 0
          path: target

      - name: Apply additive streaming patch
        run: python3 ci-src/tools/apply_mobile_streaming_patch.py target

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: target/.fvmrc
          cache: true

      - name: Format changed Dart files
        working-directory: target
        run: |
          dart format \
            lib/services/music_player_service.dart \
            lib/screens/now_playing_screen.dart \
            lib/screens/home_tab_widgets.dart \
            lib/screens/album_screen.dart \
            lib/screens/playlist_screen.dart

      - name: Check patch whitespace
        working-directory: target
        run: git diff --check

      - name: Get Flutter dependencies
        working-directory: target
        run: flutter pub get

      - name: Flutter analyze
        working-directory: target
        run: flutter analyze

      - name: Flutter tests
        working-directory: target
        run: flutter test

      - name: Commit verified mobile streaming integration
        working-directory: target
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/music_player_service.dart \
            lib/screens/now_playing_screen.dart \
            lib/screens/home_tab_widgets.dart \
            lib/screens/album_screen.dart \
            lib/screens/playlist_screen.dart
          git commit -m "feat(streaming): integrate online playback with mobile player"
          git push origin HEAD:feature/streaming-web-vietnamese
