name: One-shot Full Verification

on:
  push:
    branches:
      - ci/manual-check-20260910-1

permissions:
  contents: read

jobs:
  verify-go-flutter:
    name: Go + Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Check streaming Go formatting
        working-directory: go_backend
        run: |
          files=(extension_host_action.go extension_host_action_test.go extension_stream.go extension_stream_test.go extension_manager.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "Unformatted streaming Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        working-directory: go_backend
        run: go vet ./...

      - name: Go tests
        working-directory: go_backend
        run: go test ./...

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

  verify-web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
