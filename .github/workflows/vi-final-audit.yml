name: Vietnamese Final Audit

on:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - lib/l10n/arb/app_vi.arb
      - lib/l10n/arb/app_en.arb
      - .github/workflows/vi-final-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/streaming-web-vietnamese
      - name: Report remaining translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('lib/l10n/arb')
          en = json.loads((root / 'app_en.arb').read_text(encoding='utf-8'))
          vi = json.loads((root / 'app_vi.arb').read_text(encoding='utf-8'))
          remaining = []
          translated = 0
          total = 0
          for key, value in en.items():
              if key.startswith('@'):
                  continue
              total += 1
              vi_value = vi.get(key)
              if vi_value != value:
                  translated += 1
              else:
                  remaining.append((key, value))
          coverage = round(translated * 100 / total, 2) if total else 100
          print(f'Total: {total}')
          print(f'Translated: {translated}')
          print(f'Coverage: {coverage}%')
          print(f'Remaining: {len(remaining)}')
          for key, value in remaining:
              print(f'REMAINING\t{key}\t{json.dumps(value, ensure_ascii=False)}')
          PY
