name: Web Gateway CI

on:
  push:
    branches:
      - feature/streaming-web-vietnamese
    paths:
      - "go_backend/**"
      - ".github/workflows/web-gateway-ci.yml"
  pull_request:
    paths:
      - "go_backend/**"
      - ".github/workflows/web-gateway-ci.yml"

permissions:
  contents: read

jobs:
  gateway:
    name: Go web gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Check gateway formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l web_gateway_exports.go webgateway/*.go cmd/web-gateway/*.go)"
          if [ -n "$unformatted" ]; then
            printf 'Files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test Go backend and gateway
        run: go test ./...

      - name: Vet Go backend and gateway
        run: go vet ./...

      - name: Build web gateway
        run: go build ./cmd/web-gateway
